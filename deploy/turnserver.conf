# coturn — configuración para MiRemote.
#
# Usa el mecanismo de credenciales temporales (use-auth-secret), el mismo que
# emite el servidor de señalización en POST /v1/turn/credentials. El secreto
# compartido aquí (static-auth-secret) DEBE coincidir con MR_TURN_SECRET del
# servidor de señalización.
#
# Arranque: turnserver -c /etc/miremote/turnserver.conf

listening-port=3478
tls-listening-port=5349

# Rango de puertos relay (ajusta y abre en el firewall).
min-port=49152
max-port=65535

# Autenticación por secreto compartido con TTL (REST API).
use-auth-secret
static-auth-secret=CAMBIA_ESTO_debe_igualar_MR_TURN_SECRET

# Dominio (realm) de las credenciales.
realm=remote.example.com

# TLS (recomendado para turns:). Apunta a tus certificados.
cert=/etc/letsencrypt/live/remote.example.com/fullchain.pem
pkey=/etc/letsencrypt/live/remote.example.com/privkey.pem

# Buenas prácticas de seguridad.
no-multicast-peers
no-cli
# Evita que el TURN sea usado para alcanzar la red interna.
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
# Permite loopback solo si lo necesitas para pruebas; en producción, no.

# IP pública del servidor (necesaria tras NAT).
# external-ip=TU_IP_PUBLICA

fingerprint
stale-nonce=600
