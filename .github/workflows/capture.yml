name: capture-android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          channel: stable
      - name: Generar andamiaje y APK
        working-directory: remote_mobile
        run: |
          flutter create --platforms=android --org com.yangvii --project-name remote_mobile .
          python3 tool/ci_patch_android.py
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../MiRemote.apk
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capturar en emulador
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set +e
            WS="${GITHUB_WORKSPACE:-$(pwd)}"
            cd "$WS"
            OUT="$WS/docs"; mkdir -p "$OUT/screenshots/android" "$OUT/video" "$OUT/debug"
            PKG=com.yangvii.remote_mobile
            REMOTE="https://x-access-token:${GH_TOKEN}@github.com/luigivll/miremote.git"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B ci-captures
            # pushmark: registra la fase y sube docs/ (así cada captura se publica
            # en cuanto existe, aunque un paso posterior se cuelgue).
            pushmark() { echo "$1 $(date -u)" >> "$OUT/debug/marker.txt"; git add -f docs/ >/dev/null 2>&1; git commit -q -m "m:$1" >/dev/null 2>&1; git push -qf "$REMOTE" ci-captures >/dev/null 2>&1; }
            pushmark "phase0-start"
            timeout 60 adb wait-for-device; pushmark "phase1-device"
            timeout 180 adb install -r "$WS/MiRemote.apk"; pushmark "phase2-install"
            timeout 30 adb shell pm grant $PKG android.permission.CAMERA
            SZ=$(timeout 20 adb shell wm size 2>/dev/null)
            W=$(echo "$SZ" | grep -oE "[0-9]+x[0-9]+" | tail -1 | cut -dx -f1); [ -z "$W" ] && W=1080
            H=$(echo "$SZ" | grep -oE "[0-9]+x[0-9]+" | tail -1 | cut -dx -f2); [ -z "$H" ] && H=1920
            FABX=$((W-120)); FABY=$((H-180))
            echo "size=$SZ res=${W}x${H}" >> "$OUT/debug/marker.txt"
            timeout 60 adb shell am start -W -n $PKG/.MainActivity; pushmark "phase3-amstart-${W}x${H}"
            sleep 6
            timeout 30 adb exec-out screencap -p > "$OUT/screenshots/android/01-inicio.png"
            pushmark "phase4-home-$(stat -c%s "$OUT/screenshots/android/01-inicio.png" 2>/dev/null)"
            timeout 20 adb shell input tap $FABX $FABY
            sleep 4
            timeout 30 adb exec-out screencap -p > "$OUT/screenshots/android/02-escaner.png"
            pushmark "phase5-scanner-$(stat -c%s "$OUT/screenshots/android/02-escaner.png" 2>/dev/null)"
            timeout 20 adb shell input keyevent 4
            sleep 2
            timeout 30 adb exec-out screencap -p > "$OUT/screenshots/android/03-inicio-b.png"
            pushmark "phase6-done"
            exit 0
