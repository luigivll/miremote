name: capture-android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          channel: stable
      - name: Generar andamiaje y APK
        working-directory: remote_mobile
        run: |
          flutter create --platforms=android --org com.yangvii --project-name remote_mobile .
          python3 tool/ci_patch_android.py
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../MiRemote.apk
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capturar en emulador
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set +e
            OUT=/tmp/caps; mkdir -p "$OUT"
            exec > "$OUT/capture.log" 2>&1
            WS="${GITHUB_WORKSPACE:-$(pwd)}"
            echo "== START == WS=$WS pwd=$(pwd)"
            adb wait-for-device
            PKG=com.yangvii.remote_mobile
            echo "== install =="; adb install -r "$WS/MiRemote.apk"
            echo "== grant =="; adb shell pm grant $PKG android.permission.CAMERA
            echo "== size =="; adb shell wm size
            W=$(adb shell wm size 2>/dev/null | grep -oE '[0-9]+x[0-9]+' | tail -1 | cut -dx -f1)
            H=$(adb shell wm size 2>/dev/null | grep -oE '[0-9]+x[0-9]+' | tail -1 | cut -dx -f2)
            [ -z "$W" ] && W=1080
            [ -z "$H" ] && H=1920
            FABX=$((W-120)); FABY=$((H-180))
            echo "== res ${W}x${H} fab ${FABX},${FABY} =="
            echo "== am start =="; adb shell am start -W -n $PKG/.MainActivity
            sleep 6
            adb exec-out screencap -p > "$OUT/android_01_home.png"
            echo "home bytes: $(stat -c%s "$OUT/android_01_home.png" 2>/dev/null)"
            adb shell screenrecord --time-limit 9 /sdcard/demo.mp4 &
            REC=$!
            sleep 1
            echo "== tap FAB =="; adb shell input tap $FABX $FABY
            sleep 4
            adb exec-out screencap -p > "$OUT/android_02_scanner.png"
            echo "scanner bytes: $(stat -c%s "$OUT/android_02_scanner.png" 2>/dev/null)"
            adb shell input keyevent 4
            sleep 3
            wait $REC
            adb pull /sdcard/demo.mp4 "$OUT/android_demo.mp4"
            echo "video bytes: $(stat -c%s "$OUT/android_demo.mp4" 2>/dev/null)"
            echo "== DONE =="
            echo "== ls OUT =="; ls -la "$OUT"
            # Commit DENTRO del script, donde los ficheros existen con certeza.
            cd "$WS"
            mkdir -p docs/screenshots/android docs/video docs/debug
            cp "$OUT/android_01_home.png"    docs/screenshots/android/01-inicio.png 2>/dev/null
            cp "$OUT/android_02_scanner.png" docs/screenshots/android/02-escaner.png 2>/dev/null
            cp "$OUT/android_demo.mp4"        docs/video/android_demo.mp4 2>/dev/null
            cp "$OUT/capture.log"             docs/debug/capture.log 2>/dev/null
            echo "run $(date -u)" > docs/debug/ping.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/
            git commit -m "docs: capturas/log del APK en emulador Android [skip ci]"
            git push 2>&1 | tee -a "$OUT/capture.log"
            # Re-commit del log final (con el resultado del push), best-effort
            cp "$OUT/capture.log" docs/debug/capture.log 2>/dev/null
            git add docs/debug/capture.log && git commit -m "docs: log final [skip ci]" && git push
            exit 0
