name: capture-android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          channel: stable
      - name: Generar andamiaje y APK
        working-directory: remote_mobile
        run: |
          flutter create --platforms=android --org com.yangvii --project-name remote_mobile .
          python3 tool/ci_patch_android.py
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../MiRemote.apk
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capturar en emulador
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set +e
            WS="${GITHUB_WORKSPACE:-$(pwd)}"
            # PRUEBA MÍNIMA: ¿funciona git push desde aquí? (sin redirección)
            cd "$WS"
            echo "ISREPO: $(git rev-parse --is-inside-work-tree 2>&1)"
            mkdir -p docs/debug
            echo "gittest $(date -u)" > docs/debug/gittest.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B ci-captures 2>&1
            git add -f docs/debug/gittest.txt 2>&1
            git commit -m "gittest [skip ci]" 2>&1
            git push -f "https://x-access-token:${GH_TOKEN}@github.com/luigivll/miremote.git" ci-captures 2>&1
            echo "GITTEST push rc=$?"
            OUT="$WS/docs"
            mkdir -p "$OUT/screenshots/android" "$OUT/video" "$OUT/debug"
            LOG="$OUT/debug/capture.log"
            exec > "$LOG" 2>&1
            echo "== START == WS=$WS pwd=$(pwd)"
            adb wait-for-device
            PKG=com.yangvii.remote_mobile
            echo "== install =="; adb install -r "$WS/MiRemote.apk"
            echo "== grant =="; adb shell pm grant $PKG android.permission.CAMERA
            SZ=$(adb shell wm size 2>/dev/null); echo "== size == $SZ"
            W=$(echo "$SZ" | grep -oE '[0-9]+x[0-9]+' | tail -1 | cut -dx -f1); [ -z "$W" ] && W=1080
            H=$(echo "$SZ" | grep -oE '[0-9]+x[0-9]+' | tail -1 | cut -dx -f2); [ -z "$H" ] && H=1920
            FABX=$((W-120)); FABY=$((H-180))
            echo "== res ${W}x${H} fab ${FABX},${FABY} =="
            echo "== am start =="; adb shell am start -W -n $PKG/.MainActivity
            sleep 6
            adb exec-out screencap -p > "$OUT/screenshots/android/01-inicio.png"
            echo "home bytes: $(stat -c%s "$OUT/screenshots/android/01-inicio.png" 2>/dev/null)"
            ( adb shell screenrecord --time-limit 9 /sdcard/demo.mp4 ) &
            REC=$!
            sleep 1
            echo "== tap FAB =="; adb shell input tap $FABX $FABY
            sleep 4
            adb exec-out screencap -p > "$OUT/screenshots/android/02-escaner.png"
            echo "scanner bytes: $(stat -c%s "$OUT/screenshots/android/02-escaner.png" 2>/dev/null)"
            adb shell input keyevent 4
            sleep 3
            wait $REC
            adb pull /sdcard/demo.mp4 "$OUT/video/android_demo.mp4"
            echo "video bytes: $(stat -c%s "$OUT/video/android_demo.mp4" 2>/dev/null)"
            echo "== DONE =="
            ls -la "$OUT/screenshots/android" "$OUT/video"
            # Publicar DESDE AQUÍ (el FS del emulador no persiste a pasos
            # siguientes): commit + push con token explícito a la rama ci-captures.
            echo "run $(date -u)" > "$OUT/debug/ping.txt"
            cd "$WS"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B ci-captures
            git add -f docs/
            git commit -m "docs: capturas/log del APK en emulador Android [skip ci]"
            git push -f "https://x-access-token:${GH_TOKEN}@github.com/luigivll/miremote.git" ci-captures
            echo "push rc=$?"
            exit 0
