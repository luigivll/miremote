name: capture-android

# Verifica en un emulador real que el APK instala y arranca, y sube una captura
# de la pantalla de inicio como artefacto descargable desde la pestaña Actions.
on:
  workflow_dispatch:

jobs:
  android-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          channel: stable
      - name: Generar andamiaje y APK
        working-directory: remote_mobile
        run: |
          flutter create --platforms=android --org com.yangvii --project-name remote_mobile .
          python3 tool/ci_patch_android.py
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../MiRemote.apk
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verificar arranque en emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set +e
            echo "::warning::INSTALL $(adb install -r MiRemote.apk 2>&1 | tr '\n' ' ')"
            adb logcat -c
            echo "::warning::AMSTART $(adb shell am start -W -n com.yangvii.remote_mobile/.MainActivity 2>&1 | tr '\n' ' ')"
            sleep 10
            adb exec-out screencap -p > android-home.png
            echo "::warning::HOME bytes=$(stat -c%s android-home.png 2>/dev/null)"
            if adb logcat -d | grep -q "FATAL EXCEPTION"; then echo "::error::crash al arrancar"; fi
      - name: Subir captura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-home-screenshot
          path: android-home.png
          if-no-files-found: ignore
