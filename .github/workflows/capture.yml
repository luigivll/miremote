name: capture-android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          channel: stable
      - name: Generar andamiaje y APK
        working-directory: remote_mobile
        run: |
          flutter create --platforms=android --org com.yangvii --project-name remote_mobile .
          python3 tool/ci_patch_android.py
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../MiRemote.apk
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capturar en emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set +e
            echo "::warning::START"
            adb wait-for-device
            PKG=com.yangvii.remote_mobile
            echo "::warning::INSTALL $(adb install -r MiRemote.apk 2>&1 | tr '\n' ' ')"
            adb shell pm grant $PKG android.permission.CAMERA 2>&1
            SZ=$(adb shell wm size 2>&1); echo "::warning::SIZE $SZ"
            W=$(echo "$SZ" | grep -oE '[0-9]+x[0-9]+' | tail -1 | cut -dx -f1)
            H=$(echo "$SZ" | grep -oE '[0-9]+x[0-9]+' | tail -1 | cut -dx -f2)
            [ -z "$W" ] && W=1080; [ -z "$H" ] && H=1920
            FABX=$((W-120)); FABY=$((H-170))
            echo "::warning::AMSTART $(adb shell am start -W -n $PKG/.MainActivity 2>&1 | tr '\n' ' ')"
            sleep 6
            adb exec-out screencap -p > android_01_home.png
            echo "::warning::HOME bytes=$(stat -c%s android_01_home.png 2>/dev/null)"
            # Grabar un clip corto mientras se abre el escáner
            ( adb shell screenrecord --time-limit 9 --bit-rate 4000000 /sdcard/demo.mp4 ) &
            REC=$!
            sleep 1
            adb shell input tap $FABX $FABY
            sleep 4
            adb exec-out screencap -p > android_02_scanner.png
            echo "::warning::SCANNER bytes=$(stat -c%s android_02_scanner.png 2>/dev/null)"
            adb shell input keyevent 4
            sleep 3
            wait $REC 2>/dev/null
            adb pull /sdcard/demo.mp4 android_demo.mp4 2>&1
            echo "::warning::VIDEO bytes=$(stat -c%s android_demo.mp4 2>/dev/null)"
            exit 0
      - name: Comprobar capturas
        run: |
          for f in android_01_home.png android_02_scanner.png android_demo.mp4; do
            if [ ! -s "$f" ]; then echo "::error::falta $f"; exit 1; fi
          done
          echo "capturas OK"
      - name: Commit de capturas al repo
        run: |
          mkdir -p docs/screenshots/android docs/video
          cp android_01_home.png     docs/screenshots/android/01-inicio.png
          cp android_02_scanner.png  docs/screenshots/android/02-escaner.png
          cp android_03_home2.png    docs/screenshots/android/03-inicio.png 2>/dev/null || true
          cp android_demo.mp4        docs/video/android_demo.mp4
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/android docs/video/android_demo.mp4
          git commit -m "docs: capturas y vídeo del APK en emulador Android [skip ci]" || { echo "sin cambios"; exit 0; }
          git push
