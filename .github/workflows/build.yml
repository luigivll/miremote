name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Compilar agente (Windows GUI, sin captura nativa)
        working-directory: agent
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "-s -w -H windowsgui" -o ../MiRemoteAgent.exe ./cmd/agent
      - name: Compilar señalización y relevo (Linux)
        run: |
          (cd signaling && go build -o ../miremote-signaling ./cmd/signaling)
          (cd wol-relay && go build -o ../miremote-wolrelay ./cmd/wolrelay)
      - uses: actions/upload-artifact@v4
        with:
          name: MiRemote-windows-exe
          path: |
            MiRemoteAgent.exe
            miremote-signaling
            miremote-wolrelay

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          # >=3.27 para que el motor tenga SurfaceProducer.Callback.onSurfaceCreated,
          # que usa flutter_webrtc 0.12.12.
          flutter-version: "3.32.0"
          channel: stable
      - name: Generar andamiaje Android
        working-directory: remote_mobile
        run: flutter create --platforms=android --org com.yangvii --project-name remote_mobile .
      - name: Parchear permisos y minSdk
        working-directory: remote_mobile
        run: python3 tool/ci_patch_android.py
      - name: Dependencias
        working-directory: remote_mobile
        run: flutter pub get
      - name: Compilar APK (release)
        working-directory: remote_mobile
        run: |
          set -o pipefail
          if ! flutter build apk --release 2>&1 | tee /tmp/build.log; then
            echo "===== TAIL ====="
            tail -n 60 /tmp/build.log
            grep -iE "error:|exception|FAILURE:|What went wrong|Could not|requires|Unsupported|minSdk|compileSdk|Namespace|AGP|Kotlin|desugar|NDK" /tmp/build.log \
              | grep -ivE "warning|> 0 error|no issues" | tail -n 10 \
              | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          fi
      - name: Renombrar APK
        run: cp remote_mobile/build/app/outputs/flutter-apk/app-release.apk MiRemote.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MiRemote-apk
          path: MiRemote.apk
      - name: Validar APK (aapt badging)
        run: |
          AAPT=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/aapt 2>/dev/null | sort -V | tail -1)
          echo "aapt=$AAPT"
          "$AAPT" dump badging MiRemote.apk > badging.txt
          PKG=$(grep -oE "package: name='[^']+'" badging.txt | head -1)
          ACT=$(grep -oE "launchable-activity: name='[^']+'" badging.txt | head -1)
          SDKV=$(grep -oE "sdkVersion:'[0-9]+'" badging.txt | head -1)
          echo "::notice::$PKG"
          echo "::notice::$ACT"
          echo "::notice::min$SDKV"
          grep -oE "uses-permission: name='[^']+'" badging.txt | while IFS= read -r p; do echo "::notice::$p"; done
          if [ -z "$ACT" ]; then echo "::error::el APK no declara actividad de lanzamiento"; exit 1; fi
          echo "APK válido e instalable."
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test en emulador (instala, lanza, busca crash)
        continue-on-error: true
        id: smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set +e
            adb wait-for-device
            adb install -r MiRemote.apk > install.txt 2>&1
            echo "::warning::INSTALL $(tr '\n' ' ' < install.txt)"
            adb logcat -c
            adb shell am start -W -n com.yangvii.remote_mobile/.MainActivity > amstart.txt 2>&1
            echo "::warning::AMSTART $(tr '\n' ' ' < amstart.txt)"
            sleep 12
            adb logcat -d > logcat.txt 2>/dev/null
            if grep -q "FATAL EXCEPTION" logcat.txt; then
              echo "::warning::RESULT CRASH"
              grep -A20 "FATAL EXCEPTION" logcat.txt | head -20 | sed 's/^/::error::/'
            else
              echo "::warning::RESULT NOCRASH"
            fi
            exit 0
      - name: Resultado del smoke
        run: |
          echo "smoke outcome: ${{ steps.smoke.outcome }}"
          if [ "${{ steps.smoke.outcome }}" != "success" ]; then
            echo "::warning::El smoke en emulador no concluyó OK (puede ser infra del emulador); el APK pasó la validación aapt."
          fi

  release:
    needs: [windows-exe, android-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Preparar binarios
        run: |
          mkdir -p out
          cp dist/MiRemote-apk/MiRemote.apk out/ 2>/dev/null || true
          cp dist/MiRemote-windows-exe/MiRemoteAgent.exe out/ 2>/dev/null || true
          ls -la out
      - name: Publicar release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Última compilación (APK + EXE)
          body: |
            Binarios compilados automáticamente desde `main`.
            - **MiRemote.apk** — cliente móvil Android.
            - **MiRemoteAgent.exe** — agente de PC (Windows x64, sin captura nativa).
          prerelease: true
          files: |
            out/MiRemote.apk
            out/MiRemoteAgent.exe
