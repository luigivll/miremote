name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Compilar agente (Windows, sin captura nativa)
        working-directory: agent
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o ../MiRemoteAgent.exe ./cmd/agent
      - name: Compilar señalización y relevo (Linux)
        run: |
          (cd signaling && go build -o ../miremote-signaling ./cmd/signaling)
          (cd wol-relay && go build -o ../miremote-wolrelay ./cmd/wolrelay)
      - uses: actions/upload-artifact@v4
        with:
          name: MiRemote-windows-exe
          path: |
            MiRemoteAgent.exe
            miremote-signaling
            miremote-wolrelay

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          # >=3.27 para que el motor tenga SurfaceProducer.Callback.onSurfaceCreated,
          # que usa flutter_webrtc 0.12.12.
          flutter-version: "3.32.0"
          channel: stable
      - name: Generar andamiaje Android
        working-directory: remote_mobile
        run: flutter create --platforms=android --org com.yangvii --project-name remote_mobile .
      - name: Parchear permisos y minSdk
        working-directory: remote_mobile
        run: python3 tool/ci_patch_android.py
      - name: Dependencias
        working-directory: remote_mobile
        run: flutter pub get
      - name: Compilar APK (release)
        working-directory: remote_mobile
        run: |
          set -o pipefail
          if ! flutter build apk --release 2>&1 | tee /tmp/build.log; then
            echo "===== TAIL ====="
            tail -n 60 /tmp/build.log
            grep -iE "error:|exception|FAILURE:|What went wrong|Could not|requires|Unsupported|minSdk|compileSdk|Namespace|AGP|Kotlin|desugar|NDK" /tmp/build.log \
              | grep -ivE "warning|> 0 error|no issues" | tail -n 10 \
              | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          fi
      - name: Renombrar APK
        run: cp remote_mobile/build/app/outputs/flutter-apk/app-release.apk MiRemote.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MiRemote-apk
          path: MiRemote.apk
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test en emulador (instala, lanza, busca crash)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r MiRemote.apk
            adb logcat -c
            adb shell am start -W -n com.yangvii.remote_mobile/.MainActivity
            sleep 12
            adb logcat -d > logcat.txt
            if grep -q "FATAL EXCEPTION" logcat.txt; then
              echo "La app crasheó al arrancar:"
              grep -A25 "FATAL EXCEPTION" logcat.txt | head -25 | while IFS= read -r l; do echo "::error::$l"; done
              exit 1
            fi
            if ! grep -q "Displayed com.yangvii.remote_mobile/.MainActivity" logcat.txt; then
              echo "La actividad no llegó a mostrarse:"
              tail -30 logcat.txt | while IFS= read -r l; do echo "::error::$l"; done
              exit 1
            fi
            echo "APK smoke OK: la app instala, arranca y muestra la pantalla principal sin crash."

  release:
    needs: [windows-exe, android-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Preparar binarios
        run: |
          mkdir -p out
          cp dist/MiRemote-apk/MiRemote.apk out/ 2>/dev/null || true
          cp dist/MiRemote-windows-exe/MiRemoteAgent.exe out/ 2>/dev/null || true
          ls -la out
      - name: Publicar release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Última compilación (APK + EXE)
          body: |
            Binarios compilados automáticamente desde `main`.
            - **MiRemote.apk** — cliente móvil Android.
            - **MiRemoteAgent.exe** — agente de PC (Windows x64, sin captura nativa).
          prerelease: true
          files: |
            out/MiRemote.apk
            out/MiRemoteAgent.exe
