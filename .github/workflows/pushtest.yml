name: push-test
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "ping $(date -u)" > docs_pingtest.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs_pingtest.txt
          git commit -m "push-test [skip ci]"
          git push 2>&1 || echo "PUSH_FAILED rc=$?"
